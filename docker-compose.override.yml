services:
  minio:
    image: minio/minio:latest
    container_name: toothfairy4m-minio-$DOCKER_SUFFIX
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio1_access
      MINIO_ROOT_PASSWORD: secret_key_Ilaria00
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - app-net

  minio-init:
    image: minio/mc:latest
    container_name: toothfairy4m-minio-init-$DOCKER_SUFFIX
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minio1_access secret_key_Ilaria00;
      mc mb -p local/yggdrasil;
      exit 0;
      "
    networks:
      - app-net

volumes:
  minio_data: